name: Release Gameplay

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new release tag, for example v1.1.2
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      KEYSTORE_PASSWORD: ${{ secrets.GAMEPLAY_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.GAMEPLAY_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.GAMEPLAY_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify numeric release tag comes from working-builds
        if: github.event_name == 'push' && !startsWith(github.ref_name, 'v')
        run: git merge-base --is-ancestor HEAD origin/working-builds

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GAMEPLAY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p app/keystores
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystores/gameplay-release.jks
          cat > app/keystores/keystore.properties <<EOF
          storeFile=keystores/gameplay-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed modern APK
        run: |
          : > local.properties
          ./gradlew :app:assembleModernRelease-signed --no-daemon

      - name: Prepare release assets
        id: assets
        run: |
          apk="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          for profile in Mali-DX9-System.json Neo-Pocket-System-DX9.json Pocket-System-DX9.wcp; do
            unzip -p "$apk" "assets/$profile" | cmp - "catalog/profiles/$profile"
          done
          mkdir -p release-assets
          cp "$apk" release-assets/Gameplay-modern-release.apk

          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_code"
          test -n "$version_name"
          test "${RELEASE_TAG#v}" = "$version_name"

          sha256="$(sha256sum release-assets/Gameplay-modern-release.apk | cut -d ' ' -f 1)"
          size_bytes="$(stat -c '%s' release-assets/Gameplay-modern-release.apk)"
          printf '%s  %s\n' "$sha256" Gameplay-modern-release.apk > release-assets/SHA256SUMS.txt
          cat > release-assets/Gameplay-modern-release.json <<EOF
          {
            "schemaVersion": 1,
            "packageName": "app.gameplay",
            "versionCode": $version_code,
            "versionName": "$version_name",
            "assetName": "Gameplay-modern-release.apk",
            "sha256": "$sha256",
            "sizeBytes": $size_bytes
          }
          EOF

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="${RELEASE_TAG#v}" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found { print }
          ' CHANGELOG.md > release-assets/notes.md
          notes=(--generate-notes)
          if grep -q '[^[:space:]]' release-assets/notes.md; then
            notes=(--notes-file release-assets/notes.md)
          fi
          assets=(release-assets/Gameplay-modern-release.apk release-assets/Gameplay-modern-release.json release-assets/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            if [[ "${notes[0]}" == "--notes-file" ]]; then
              gh release edit "$RELEASE_TAG" "${notes[@]}"
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --title "Gameplay ${{ steps.assets.outputs.version_name }}" "${notes[@]}"
          fi
