name: Pull Request build check

on:
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  catalog-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate generated component catalog
        run: |
          python3 scripts/catalog/generate_catalog.py --check
          python3 -m unittest discover -s scripts/catalog -p 'test_*.py'

  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = False
          for path in glob.glob('.github/workflows/*.yml'):
              try:
                  with open(path) as f:
                      yaml.safe_load(f)
                  print(f"ok: {path}")
              except Exception as e:
                  print(f"INVALID: {path}: {e}")
                  bad = True
          sys.exit(1 if bad else 0)
          EOF

  build:
    runs-on: ubuntu-latest
    needs: [catalog-validation, validate-workflows]

    steps:
      - name: Checking out Gameplay
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Inject credentials
        run: ": > local.properties"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest :app:testModernDebugUnitTest
      - name: Assemble legacy debug
        run: ./gradlew :app:assembleLegacyDebug
      - name: Assemble modern debug
        run: ./gradlew :app:assembleModernDebug
      - name: Lint legacy debug
        continue-on-error: true
        run: ./gradlew :app:lintLegacyDebug
      - name: Lint modern debug
        continue-on-error: true
        run: ./gradlew :app:lintModernDebug
      - name: Native ELF audit
        run: |
          chmod +x scripts/ci/native_elf_audit.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq binutils llvm >/dev/null
          scripts/ci/native_elf_audit.sh
      - name: Dependency report
        run: ./gradlew :app:dependencies --configuration modernDebugRuntimeClasspath > build/dependency-report.txt
      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: build/dependency-report.txt
